<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce-website</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="shortcut icon" href="src/img/logo.png" type="image/x-icon">
</head>
<body class="home-bg text-white">
    <head>
        <div class="pl-10 pt-5"><img src="src/img/logo.png" alt="logo" class="w-15"></div>
    </head>
    <section class="hidden">
       <div class="w-[50%] m-auto text-center mt-[5%]">
         <h1 class="font-black text-7xl text-red-500">Welcome to dummy E-commer's website</h1>
        <p class="text-xl font-bold pt-5 italic">Let Us know who you are</p>
        <div class="flex justify-center pt-5 gap-10">
            <p><a href="#" class="underline text-2xl">Customer</a></p>
            <p><a href="#" class="underline text-2xl">Admin</a></p>
        </div>
       </div>
    </section>
    
    <!-- logins -->
<section>
    <div class="w-[50%] m-auto text-center shadow-2xl border-4 border-[#535151de] rounded-2xl p-5 bg-[#000000b7] space-y-10">
        <div>
            <h1 class="font-black text-5xl pb-2 text-red-500">Login to start</h1>
        <p class="text-red-200"><i>Dear valued Customer, enter your details to continue</i></p>
        </div>
        <form action="" class=" ml-[5%] space-y-10">
            <input type="text" placeholder="Enter your name" class="w-[50%] border border-[#535151de] py-2 pl-2 outline outline-[#5d5b5bbe]"><br>
            
            <input type="email" name="email" placeholder="Enter your email" class="w-[50%] border border-[#535151de] py-2 pl-2 outline outline-[#5d5b5bbe]"><br>

            <div>
            <input type="password" name="pass" placeholder="Enter your password" class="w-[50%] border border-[#535151de] py-2 pl-2 outline outline-[#5d5b5bbe]">

             <div class="text-sm flex justify-center gap-24">
            <p><a href="#" class="text-blue-400">forgotten password?</a></p>

            <div class="flex items-center ">
                <input type="checkbox" name="" id="check"><label for="check">Remind me</label>
            </div>
            </div>

        </div>

            <input type="submit" value="Login" id="" class="w-[50%] border border-[#535151de] py-2 pl-2 outline outline-[#5d5b5bbe] rounded-3xl bg-[#a71010ac] hover:bg-[#a71010ce] hover:transition">
        </form>
       
    </div>
</section>


    <script src="script.js"></script>
</body>
</html>
