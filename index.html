<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce-website</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="shortcut icon" href="src/img/logo.png" type="image/x-icon">
</head>
<body class="home-bg text-white">
    <head>
        <div class="pl-10 pt-5"><img src="src/img/logo.png" alt=""></div>
    </head>
    <section class="hidden">
       <div class="w-[50%] m-auto text-center mt-[5%]">
         <h1 class="font-black text-7xl text-red-500">Welcome to dummy E-commer's website</h1>
        <p class="text-xl font-bold pt-5 italic">Let Us know who you are</p>
        <div class="flex justify-center pt-5 gap-10">
            <p><a href="#" class="underline text-2xl">Customer</a></p>
            <p><a href="#" class="underline text-2xl">Admin</a></p>
        </div>
       </div>
    </section>
    
    <!-- logins -->
<section>
    <div class="w-[50%] m-auto text-center border-2 rounded-2xl p-5 space-y-10">
        <div>
            <h1 class="font-black text-5xl pb-2">Login to start</h1>
        <p><i>Dear valued Customer, enter your details to continue</i></p>
        </div>
        <form action="" class=" ml-[5%] space-y-10">
            <input type="text" placeholder="Enter your name" class="w-[50%] border py-2 pl-2"><br>
            
            <input type="email" name="email" placeholder="Enter your email" class="border w-[50%] py-2 pl-2"><br>

            <input type="password" name="pass" placeholder="Enter your password" class="w-[50%] border py-2 pl-2">
        </form>
    </div>
</section>


    <script src="script.js"></script>
</body>
</html>
