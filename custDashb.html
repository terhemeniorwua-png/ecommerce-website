<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopHub-customer-Dashboard</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-gray-100 p-8">



    <!-- Desktop Header -->
<header class="max-md: bg-white rounded-2xl shadow-md px-8 py-4 flex items-center justify-between">

    <!-- Logo -->
    <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center">
            <i class="fa-solid fa-bag-shopping text-white text-xl"></i>
        </div>

        <h1 class="text-3xl font-bold text-gray-800">
           <a href="adminDasb.html"> ShopHub</a>
        </h1>
    </div>

    <!-- Search -->
    <div class="flex w-[50%]">

        <select
            class="bg-gray-50 border border-gray-200 border-r-0 rounded-l-lg px-4 outline-none text-gray-700">
            <option selected disabled>Select category</option>
            <option>All Categories</option>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Beauty</option>
        </select>

        <input type="text" placeholder="SearchInput for products..."
            class="flex-1 border border-gray-200 py-2 px-4 outline-none">

        <button
            class="searchBtn bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-r-lg transition">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

    </div>

    <!-- Right Side -->
    <div class="flex items-center gap-10"> 

        <!-- Cart -->
        <div class="flex items-center gap-2 relative cursor-pointer"> 

            <!-- cart quantity -->
           <span class="absolute -top-6 left-10 p-3 py-4 h-5 rounded-full bg-blue-600 text-white text-xs flex items-center justify-center">
               0
            </span>

            <i class="fa-solid fa-cart-shopping text-2xl text-gray-700"></i>

            <p class="font-medium text-gray-700">
                Cart
            </p>

        </div> 

        <!-- Profile -->
        <div class="flex items-center gap-2 cursor-pointer">

            <i class="fa-regular fa-user text-2xl text-gray-700"></i>

            <p class="font-medium text-gray-700">
                Profile
            </p>

        </div>`

    </div>

</header>


<!-- main -->

<main>

    <div class="">
        <ul class="flex justify-center items-center gap-10 pt-5 text-xl nav">
            <li class="bg-gray-200 p-2 rounded-xl px-5">All</li>
        </ul>
    </div>

    <section class="md:grid grid-cols-2 items-center">
        <div class="md:leading-10 md:px-[5%]">
            <h1 class="font-bold text-3xl md:text-6xl">Discover Amazing Products</h1>

            <p class="py-5 w-[60%]">Find the best products at the best prices. Quantity you can trust</p>

            <button class="bg-blue-600 text-white max-md:py-2 px-4 rounded-md">Shope Now</button>
        </div>
        <div>
            <img src="src/img/Pasted image.png" alt="" class="w-full">
        </div>
    </section>


    <!-- popular products -->

    <section>
        <h1 class="font-black text-3xl pb-5">Popular Products</h1>
     <div class="products md:grid grid-cols-4 items-center md:gap-10"></div>
    </section>







          <dialog class="dialog mt-36 w-[50%] shadow-2xl border border-amber-800 m-auto text-center py-20">
            <h1 class="text-5xl heading">Error</h1>
            <p class="erromssg pt-5 text-xl"></p>

           <div class="flex justify-end">
             <button class=" border bg-blue-500 mr-20 p-1 px-5 rounded cancelBtn">Cancel</button>
           </div>
           
        </dialog>
    </div>

    <p class="time font-black text-3xl"></p>
</main>


    <script type="module" src="script.js"></script>
</body>
</html>
